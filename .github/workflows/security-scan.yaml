name: IaC Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:   

permissions:
  contents: read
  security-events: write
  pages: write
  id-token: write  

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Crear carpeta de reportes
        run: mkdir -p reports/checkov reports/tfsec

      # ── Checkov ──────────────────────────────
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/aws
          framework: terraform
          output_format: sarif,json,cli
          output_file_path: reports/checkov
          soft_fail: true   # no bloquea todavia, primero queremos visibilidad

      # ── tfsec ────────────────────────────────
      - name: Install tfsec
        run: |
         curl -L https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o tfsec
         chmod +x tfsec
         sudo mv tfsec /usr/local/bin/

      - name: Run tfsec (SARIF)
        continue-on-error: true
        run: |
         tfsec terraform/aws \
         --format sarif \
         --out reports/tfsec/tfsec

      - name: Run tfsec (JSON)
        continue-on-error: true
        run: |
         tfsec terraform/aws \
         --format json \
         --out reports/tfsec/tfsec
      # ── Subir SARIF a la pestaña Security ───
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov/results_sarif.sarif
          category: checkov

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/tfsec/tfsec.sarif
          category: tfsec

      # ── Conservar reportes como artefactos ──
      - name: Archive security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: reports/
          retention-days: 90

  dashboard:
        name: Publish Security Dashboard
        needs: scan
        runs-on: ubuntu-latest
        steps:
          - name: Download reports
            uses: actions/download-artifact@v4
            with:
             name: security-reports-${{ github.run_number }}
             path: reports

          - name: Build dashboard
            run: |
             mkdir site

             TOTAL=$(grep -o '"severity"' reports/checkov/results_json.json | wc -l)

             CRITICAL=$(grep -o '"CRITICAL"' reports/checkov/results_json.json | wc -l)
             HIGH=$(grep -o '"HIGH"' reports/checkov/results_json.json | wc -l)
             MEDIUM=$(grep -o '"MEDIUM"' reports/checkov/results_json.json | wc -l)
             LOW=$(grep -o '"LOW"' reports/checkov/results_json.json | wc -l)

             cat > site/index.html <<EOF
             <!DOCTYPE html>
             <html>
             <head>
                <title>Security Dashboard</title>
                <style>
                body{
                    font-family:Arial;
                    margin:40px;
                    background:#f5f5f5;
                }
                .card{
                    display:inline-block;
                    width:180px;
                    margin:10px;
                    padding:20px;
                    background:white;
                    border-radius:10px;
                    box-shadow:0 0 8px #ddd;
                    text-align:center;
                }
                h1{
                    color:#333;
                }
                </style>
             </head>
             <body>

             <h1>Terraform Security Dashboard</h1>

             <p>Run #${{ github.run_number }}</p>

             <div class="card">
             <h2>Total</h2>
             <h1>$TOTAL</h1>
             </div>

             <div class="card">
             <h2>Critical</h2>
             <h1>$CRITICAL</h1>
             </div>

             <div class="card">
             <h2>High</h2>
             <h1>$HIGH</h1>
             </div>

             <div class="card">
             <h2>Medium</h2>
             <h1>$MEDIUM</h1>
             </div>
 
             <div class="card">
             <h2>Low</h2>
             <h1>$LOW</h1>
             </div>

             <p>Generated automatically by GitHub Actions.</p>

             </body>
             </html>
             EOF
             
          - name: Configure Pages
            uses: actions/configure-pages@v5
          - name: Upload Pages Artifact
            uses: actions/upload-pages-artifact@v3
            with:
             path: site

          - name: Deploy to GitHub Pages
            uses: actions/deploy-pages@v4

    