name: IaC Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Crear carpeta de reportes
        run: mkdir -p reports/checkov reports/tfsec

      # ── Checkov ──────────────────────────────
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/aws
          framework: terraform
          output_format: sarif,json,cli
          output_file_path: reports/checkov
          soft_fail: true   # no bloquea todavia, primero queremos visibilidad

      # ── tfsec ────────────────────────────────
      - name: Install tfsec
        run: |
          curl -L https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o tfsec
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/

      - name: Run tfsec (SARIF)
        continue-on-error: true
        run: |
          tfsec terraform/aws \
            --format sarif \
            --out reports/tfsec/tfsec.sarif

      - name: Run tfsec (JSON)
        continue-on-error: true
        run: |
          tfsec terraform/aws \
            --format json \
            --out reports/tfsec/tfsec.json

      # ── Verificación defensiva de archivos ──
      # Antes de asumir que existen, listamos. Si checkov-action o tfsec
      # cambian su naming en una futura versión, esto te lo va a mostrar
      # en el log en vez de dejarte con un dashboard vacío sin explicación.
      - name: Verificar reportes generados
        if: always()
        run: |
          echo "── reports/checkov ──"
          ls -la reports/checkov || true
          echo "── reports/tfsec ──"
          ls -la reports/tfsec || true

      # ── Subir SARIF a la pestaña Security ───
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov/results_sarif.sarif
          category: checkov

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/tfsec/tfsec.sarif
          category: tfsec

      # ── Conservar reportes como artefactos ──
      - name: Archive security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: reports/
          retention-days: 90

  dashboard:
    name: Publish Security Dashboard
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: reports

      - name: Build dashboard
        run: |
          set -u
          # Nota: NO agrego -e ni -o pipefail acá porque GitHub Actions ya
          # invoca este run: con `bash -e -o pipefail {0}` por default.
          # Ya están activos aunque no los pongas. Lo que sí hace falta es
          # asegurarse de que ningún jq quede en un pipe que pueda cerrarse
          # antes de tiempo (ver limit() más abajo) y que las cuentas con //
          # tengan fallback para que un severity null no tumbe el step
          # bajo -u.

          mkdir -p site

          CHECKOV_JSON=reports/checkov/results_json.json
          TFSEC_JSON=reports/tfsec/tfsec.json

          # ── Checkov: results.failed_checks es un ARRAY, no .results[] ──
          TOTAL=$(jq '.results.failed_checks | length' "$CHECKOV_JSON")
          CRITICAL=$(jq '[.results.failed_checks[] | select(.severity=="CRITICAL")] | length' "$CHECKOV_JSON")
          HIGH=$(jq '[.results.failed_checks[] | select(.severity=="HIGH")] | length' "$CHECKOV_JSON")
          MEDIUM=$(jq '[.results.failed_checks[] | select(.severity=="MEDIUM")] | length' "$CHECKOV_JSON")
          LOW=$(jq '[.results.failed_checks[] | select(.severity=="LOW")] | length' "$CHECKOV_JSON")

          # Nota: sin API key de Bridgecrew/Prisma, severity viene null en
          # Checkov, así que CRITICAL/HIGH/MEDIUM/LOW pueden dar 0 aunque
          # TOTAL sea > 0. Es esperado, no es un bug nuevo.
          # Usamos limit() en vez de "| head -5": head cierra el pipe apenas
          # lee sus 5 líneas, y si jq todavía tiene más output para escribir
          # recibe EPIPE. Desde jq 1.6 eso se reporta como error explícito
          # (exit code 2) en vez de morir en silencio por SIGPIPE, así que
          # "jq | head" te revienta el step bajo el -e/-o pipefail que
          # GitHub Actions ya activa por default en cada run:. limit()
          # corta el resultado dentro del propio proceso jq, sin pipe.
          TOP_FINDINGS_CHECKOV=$(jq -r '
            limit(5; .results.failed_checks[])
            | "\(.severity // "N/A") - \(.check_id) - \(.check_name)"
          ' "$CHECKOV_JSON")

          # ── tfsec: .results ya es un array plano, esto sí era correcto ──
          TFSEC_TOTAL=$(jq '.results | length' "$TFSEC_JSON")
          TFSEC_CRITICAL=$(jq '[.results[] | select(.severity=="CRITICAL")] | length' "$TFSEC_JSON")
          TFSEC_HIGH=$(jq '[.results[] | select(.severity=="HIGH")] | length' "$TFSEC_JSON")
          TFSEC_MEDIUM=$(jq '[.results[] | select(.severity=="MEDIUM")] | length' "$TFSEC_JSON")
          TFSEC_LOW=$(jq '[.results[] | select(.severity=="LOW")] | length' "$TFSEC_JSON")

          TOP_FINDINGS_TFSEC=$(jq -r '
            limit(5; .results[])
            | "\(.severity // "N/A") - \(.rule_id) - \(.description)"
          ' "$TFSEC_JSON")

          # ── Totales combinados ──
          COMBINED_TOTAL=$((TOTAL + TFSEC_TOTAL))
          COMBINED_CRITICAL=$((CRITICAL + TFSEC_CRITICAL))
          COMBINED_HIGH=$((HIGH + TFSEC_HIGH))
          COMBINED_MEDIUM=$((MEDIUM + TFSEC_MEDIUM))
          COMBINED_LOW=$((LOW + TFSEC_LOW))

          cat > site/index.html <<HTMLEOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Security Dashboard</title>
            <style>
              body{font-family:Arial;margin:40px;background:#f5f5f5;}
              .card{display:inline-block;width:180px;margin:10px;padding:20px;background:white;border-radius:10px;box-shadow:0 0 8px #ddd;text-align:center;}
              h1{color:#333;}
              .section-title{margin-top:40px;}
              pre{white-space:pre-wrap;text-align:left;}
            </style>
          </head>
          <body>
          <h1>Terraform Security Dashboard</h1>
          <p>Run #${{ github.run_number }}</p>

          <h2 class="section-title">Totales combinados (Checkov + tfsec)</h2>
          <div class="card"><h2>Total</h2><h1>$COMBINED_TOTAL</h1></div>
          <div class="card"><h2>Critical</h2><h1>$COMBINED_CRITICAL</h1></div>
          <div class="card"><h2>High</h2><h1>$COMBINED_HIGH</h1></div>
          <div class="card"><h2>Medium</h2><h1>$COMBINED_MEDIUM</h1></div>
          <div class="card"><h2>Low</h2><h1>$COMBINED_LOW</h1></div>

          <h2 class="section-title">Checkov</h2>
          <div class="card"><h2>Total</h2><h1>$TOTAL</h1></div>
          <div class="card"><h2>Critical</h2><h1>$CRITICAL</h1></div>
          <div class="card"><h2>High</h2><h1>$HIGH</h1></div>
          <div class="card"><h2>Medium</h2><h1>$MEDIUM</h1></div>
          <div class="card"><h2>Low</h2><h1>$LOW</h1></div>
          <div class="card">
            <h2>Top Findings</h2>
            <pre>$TOP_FINDINGS_CHECKOV</pre>
          </div>

          <h2 class="section-title">tfsec</h2>
          <div class="card"><h2>Total</h2><h1>$TFSEC_TOTAL</h1></div>
          <div class="card"><h2>Critical</h2><h1>$TFSEC_CRITICAL</h1></div>
          <div class="card"><h2>High</h2><h1>$TFSEC_HIGH</h1></div>
          <div class="card"><h2>Medium</h2><h1>$TFSEC_MEDIUM</h1></div>
          <div class="card"><h2>Low</h2><h1>$TFSEC_LOW</h1></div>
          <div class="card">
            <h2>Top Findings</h2>
            <pre>$TOP_FINDINGS_TFSEC</pre>
          </div>

          <p>Generated automatically by GitHub Actions.</p>
          </body>
          </html>
          HTMLEOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4