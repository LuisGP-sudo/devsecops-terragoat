name: IaC Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Crear carpeta de reportes
        run: mkdir -p reports/checkov reports/tfsec

      # ── Checkov ──────────────────────────────
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/aws
          framework: terraform
          output_format: sarif,json,cli
          output_file_path: reports/checkov
          soft_fail: true   # no bloquea todavia, primero queremos visibilidad

      # ── tfsec ────────────────────────────────
      - name: Install tfsec
        run: |
          curl -L https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o tfsec
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/

      - name: Run tfsec (SARIF)
        continue-on-error: true
        run: |
          tfsec terraform/aws \
            --format sarif \
            --out reports/tfsec/tfsec.sarif

      - name: Run tfsec (JSON)
        continue-on-error: true
        run: |
          tfsec terraform/aws \
            --format json \
            --out reports/tfsec/tfsec.json

      # ── Verificación defensiva de archivos ──
      # Antes de asumir que existen, listamos. Si checkov-action o tfsec
      # cambian su naming en una futura versión, esto te lo va a mostrar
      # en el log en vez de dejarte con un dashboard vacío sin explicación.
      - name: Verificar reportes generados
        if: always()
        run: |
          echo "── reports/checkov ──"
          ls -la reports/checkov || true
          echo "── reports/tfsec ──"
          ls -la reports/tfsec || true

      # ── Subir SARIF a la pestaña Security ───
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov/results_sarif.sarif
          category: checkov

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/tfsec/tfsec.sarif
          category: tfsec

      # ── Conservar reportes como artefactos ──
      - name: Archive security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: reports/
          retention-days: 90

  dashboard:
    name: Publish Security Dashboard
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: reports

      - name: Build dashboard
        run: |
          set -u
          # Nota: NO agrego -e ni -o pipefail acá porque GitHub Actions ya
          # invoca este run: con `bash -e -o pipefail {0}` por default.
          # Ya están activos aunque no los pongas. Lo que sí hace falta es
          # asegurarse de que ningún jq quede en un pipe que pueda cerrarse
          # antes de tiempo (ver limit() más abajo) y que las cuentas con //
          # tengan fallback para que un severity null no tumbe el step
          # bajo -u.

          mkdir -p site

          CHECKOV_JSON=reports/checkov/results_json.json
          TFSEC_JSON=reports/tfsec/tfsec.json
          SEVERITY_MAP=.github/security/checkov-severity-map.json

          # ── Enriquecer Checkov con nuestra propia matriz de severidad ──
          # Checkov solo devuelve severity real si está integrado con
          # Bridgecrew/Prisma Cloud (API key). Sin eso, .severity es null
          # para el 100% de los findings. En vez de depender de esa API,
          # cruzamos check_id contra checkov-severity-map.json (versionado
          # en el repo, con criterio documentado por check).
          # check_id sin entrada en el mapa cae en "UNKNOWN" en vez de
          # fallar silenciosamente — así un check nuevo que Checkov agregue
          # en el futuro no desaparece del conteo, solo queda sin clasificar
          # hasta que lo agreguemos a la matriz.
          jq --slurpfile map "$SEVERITY_MAP" '
            ($map[0]) as $m
            | .results.failed_checks
            | map(. + {severity: ($m[.check_id].severity // "UNKNOWN")})
          ' "$CHECKOV_JSON" > reports/checkov/enriched.json

          UNKNOWN_COUNT=$(jq '[.[] | select(.severity=="UNKNOWN")] | length' reports/checkov/enriched.json)
          if [ "$UNKNOWN_COUNT" -gt 0 ]; then
            echo "⚠️  $UNKNOWN_COUNT findings de Checkov sin clasificar en la matriz de severidad. Revisar checkov-severity-map.json"
            jq -r '[.[] | select(.severity=="UNKNOWN") | .check_id] | unique | .[]' reports/checkov/enriched.json
          fi

          TOTAL=$(jq 'length' reports/checkov/enriched.json)
          CRITICAL=$(jq '[.[] | select(.severity=="CRITICAL")] | length' reports/checkov/enriched.json)
          HIGH=$(jq '[.[] | select(.severity=="HIGH")] | length' reports/checkov/enriched.json)
          MEDIUM=$(jq '[.[] | select(.severity=="MEDIUM")] | length' reports/checkov/enriched.json)
          LOW=$(jq '[.[] | select(.severity=="LOW")] | length' reports/checkov/enriched.json)

          # Top findings ordenado por severidad real, no por orden de archivo
          TOP_FINDINGS_CHECKOV=$(jq -r '
            def rank: {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"UNKNOWN":4}[.severity] // 5;
            sort_by(rank)
            | limit(5; .[])
            | "\(.severity) - \(.check_id) - \(.check_name)"
          ' reports/checkov/enriched.json)

          # ── tfsec: .results ya es un array plano, esto sí era correcto ──
          TFSEC_TOTAL=$(jq '.results | length' "$TFSEC_JSON")
          TFSEC_CRITICAL=$(jq '[.results[] | select(.severity=="CRITICAL")] | length' "$TFSEC_JSON")
          TFSEC_HIGH=$(jq '[.results[] | select(.severity=="HIGH")] | length' "$TFSEC_JSON")
          TFSEC_MEDIUM=$(jq '[.results[] | select(.severity=="MEDIUM")] | length' "$TFSEC_JSON")
          TFSEC_LOW=$(jq '[.results[] | select(.severity=="LOW")] | length' "$TFSEC_JSON")

          # ── Top findings como filas de tabla (con badge de color) ──
          # en vez de texto plano en un <pre>. El campo severity de Checkov
          # ya viene garantizado (CRITICAL/HIGH/MEDIUM/LOW/UNKNOWN gracias
          # al enriquecimiento de arriba), así que no necesita fallback acá.
          TOP_FINDINGS_CHECKOV_HTML=$(jq -r '
            def rank: {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"UNKNOWN":4}[.severity] // 5;
            sort_by(rank) | limit(8; .[])
            | "<tr><td><span class=\"badge badge-\(.severity|ascii_downcase)\">\(.severity)</span></td><td class=\"mono\">\(.check_id)</td><td>\(.check_name)</td></tr>"
          ' reports/checkov/enriched.json)

          # tfsec sí trae severity nativo, pero por las dudas cubrimos el
          # caso null con $sev antes de hacer ascii_downcase (downcase de
          # null tira error en jq, no un string vacío).
          TOP_FINDINGS_TFSEC_HTML=$(jq -r '
            def rank: {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3}[.severity] // 4;
            .results | sort_by(rank) | limit(8; .[])
            | (.severity // "N/A") as $sev
            | "<tr><td><span class=\"badge badge-\($sev|ascii_downcase)\">\($sev)</span></td><td class=\"mono\">\(.rule_id)</td><td>\(.description)</td></tr>"
          ' "$TFSEC_JSON")

          # ── Totales combinados ──
          COMBINED_TOTAL=$((TOTAL + TFSEC_TOTAL))
          COMBINED_CRITICAL=$((CRITICAL + TFSEC_CRITICAL))
          COMBINED_HIGH=$((HIGH + TFSEC_HIGH))
          COMBINED_MEDIUM=$((MEDIUM + TFSEC_MEDIUM))
          COMBINED_LOW=$((LOW + TFSEC_LOW))

          # ── Score de riesgo estilo PingCastle ──
          # Ponderación inspirada en el modelo de CVSS: cada CRITICAL pesa
          # 5x más que un LOW. Cap en 100 porque el gauge es un semicírculo
          # de 0 a 100, no un contador infinito - pasado cierto punto "más
          # findings" ya no aporta información nueva sobre el nivel de riesgo,
          # el mensaje "estás mal" ya quedó claro.
          RAW_SCORE=$((COMBINED_CRITICAL*10 + COMBINED_HIGH*5 + COMBINED_MEDIUM*2 + COMBINED_LOW*1))
          if [ "$RAW_SCORE" -gt 100 ]; then SCORE=100; else SCORE=$RAW_SCORE; fi

          # Ángulo de la aguja: coincide con las bandas de color del gauge
          # (ver comentario en el SVG más abajo sobre la convención de
          # rotación). score=0 -> -90deg (izquierda), score=100 -> +90deg
          # (derecha), score=50 -> 0deg (arriba).
          ANGLE=$(awk -v s="$SCORE" 'BEGIN{printf "%.1f", (s/100*180)-90}')

          if [ "$SCORE" -ge 75 ]; then
            RISK_LABEL="CRÍTICO"; RISK_COLOR="#ef4444"
          elif [ "$SCORE" -ge 50 ]; then
            RISK_LABEL="ALTO"; RISK_COLOR="#f97316"
          elif [ "$SCORE" -ge 25 ]; then
            RISK_LABEL="MEDIO"; RISK_COLOR="#eab308"
          else
            RISK_LABEL="BAJO"; RISK_COLOR="#22c55e"
          fi

          cat > site/index.html <<HTMLEOF
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="UTF-8">
          <title>Security Dashboard</title>
          <style>
            :root {
              --critical: #ef4444;
              --high: #f97316;
              --medium: #eab308;
              --low: #22c55e;
              --checkov: #3b82f6;
              --tfsec: #8b5cf6;
              --bg: #0f172a;
              --card-bg: #1e293b;
              --text: #e2e8f0;
              --text-dim: #94a3b8;
            }
            * { box-sizing: border-box; }
            body {
              font-family: -apple-system, "Segoe UI", Arial, sans-serif;
              margin: 0;
              padding: 40px;
              background: var(--bg);
              color: var(--text);
            }
            h1 { margin: 0 0 4px 0; }
            .run-info { color: var(--text-dim); margin-bottom: 32px; }
            .section {
              margin-top: 40px;
              padding: 24px;
              border-radius: 12px;
              background: rgba(255,255,255,0.03);
            }
            .section-combined { border-left: 6px solid #fff; }
            .section-checkov { border-left: 6px solid var(--checkov); }
            .section-tfsec { border-left: 6px solid var(--tfsec); }
            .section h2 { margin-top: 0; }
            .cards { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
            .card {
              flex: 1 1 140px;
              padding: 20px;
              background: var(--card-bg);
              border-radius: 10px;
              text-align: center;
              border-top: 4px solid transparent;
            }
            .card h3 { margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em; }
            .card .value { font-size: 32px; font-weight: 700; }
            .card.critical { border-top-color: var(--critical); }
            .card.high { border-top-color: var(--high); }
            .card.medium { border-top-color: var(--medium); }
            .card.low { border-top-color: var(--low); }

            .gauge-wrap { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
            .gauge-score { font-size: 48px; font-weight: 800; }
            .gauge-label { font-size: 18px; font-weight: 700; letter-spacing: 0.05em; }

            table { width: 100%; border-collapse: collapse; margin-top: 16px; }
            th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; }
            th { color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 12px; }
            td.mono { font-family: "SF Mono", Consolas, monospace; color: var(--text-dim); }

            .badge {
              display: inline-block;
              padding: 3px 10px;
              border-radius: 999px;
              font-size: 11px;
              font-weight: 700;
              text-transform: uppercase;
              color: #0f172a;
            }
            .badge-critical { background: var(--critical); color: #fff; }
            .badge-high { background: var(--high); }
            .badge-medium { background: var(--medium); }
            .badge-low { background: var(--low); }
            .badge-unknown, .badge-n\/a { background: #64748b; color: #fff; }

            footer { margin-top: 40px; color: var(--text-dim); font-size: 13px; }
          </style>
          </head>
          <body>

          <h1>Terraform Security Dashboard</h1>
          <div class="run-info">Run #${{ github.run_number }} · $(date -u +"%Y-%m-%d %H:%M UTC")</div>

          <div class="section section-combined">
            <h2>Nivel de riesgo general</h2>
            <div class="gauge-wrap">
              <svg width="300" height="170" viewBox="0 0 300 170">
                <!-- Bandas de color precalculadas geométricamente (semicírculo,
                     radio externo 130, interno 90, centro 150,150). Son fijas,
                     no dependen de los datos - solo la aguja se mueve. -->
                <path d="M 20.00 150.00 A 130 130 0 0 0 58.08 58.08 L 86.36 86.36 A 90 90 0 0 1 60.00 150.00 Z" fill="var(--low)"/>
                <path d="M 58.08 58.08 A 130 130 0 0 0 150.00 20.00 L 150.00 60.00 A 90 90 0 0 1 86.36 86.36 Z" fill="var(--medium)"/>
                <path d="M 150.00 20.00 A 130 130 0 0 0 241.92 58.08 L 213.64 86.36 A 90 90 0 0 1 150.00 60.00 Z" fill="var(--high)"/>
                <path d="M 241.92 58.08 A 130 130 0 0 0 280.00 150.00 L 240.00 150.00 A 90 90 0 0 1 213.64 86.36 Z" fill="var(--critical)"/>
                <!-- Aguja: línea vertical desde el centro, rotada según ANGLE.
                     rotate() de SVG es horario en positivo; con ANGLE=-90 apunta
                     a la izquierda (score 0), ANGLE=0 arriba (score 50), ANGLE=90
                     a la derecha (score 100). Ver cálculo de ANGLE en el script. -->
                <line x1="150" y1="150" x2="150" y2="40" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" transform="rotate($ANGLE 150 150)"/>
                <circle cx="150" cy="150" r="10" fill="#e2e8f0"/>
              </svg>
              <div>
                <div class="gauge-score" style="color: $RISK_COLOR">$SCORE</div>
                <div class="gauge-label" style="color: $RISK_COLOR">$RISK_LABEL</div>
                <div style="color: var(--text-dim); font-size: 13px; margin-top: 4px;">
                  score = CRITICAL×10 + HIGH×5 + MEDIUM×2 + LOW×1 (cap 100)
                </div>
              </div>
            </div>
            <div class="cards">
              <div class="card critical"><h3>Critical</h3><div class="value">$COMBINED_CRITICAL</div></div>
              <div class="card high"><h3>High</h3><div class="value">$COMBINED_HIGH</div></div>
              <div class="card medium"><h3>Medium</h3><div class="value">$COMBINED_MEDIUM</div></div>
              <div class="card low"><h3>Low</h3><div class="value">$COMBINED_LOW</div></div>
              <div class="card"><h3>Total</h3><div class="value">$COMBINED_TOTAL</div></div>
            </div>
          </div>

          <div class="section section-checkov">
            <h2>Checkov <span style="color: var(--text-dim); font-weight: 400; font-size: 14px;">· severidad clasificada con matriz propia</span></h2>
            <div class="cards">
              <div class="card critical"><h3>Critical</h3><div class="value">$CRITICAL</div></div>
              <div class="card high"><h3>High</h3><div class="value">$HIGH</div></div>
              <div class="card medium"><h3>Medium</h3><div class="value">$MEDIUM</div></div>
              <div class="card low"><h3>Low</h3><div class="value">$LOW</div></div>
              <div class="card"><h3>Total</h3><div class="value">$TOTAL</div></div>
            </div>
            <table>
              <thead><tr><th>Severidad</th><th>Check ID</th><th>Descripción</th></tr></thead>
              <tbody>
              $TOP_FINDINGS_CHECKOV_HTML
              </tbody>
            </table>
          </div>

          <div class="section section-tfsec">
            <h2>tfsec</h2>
            <div class="cards">
              <div class="card critical"><h3>Critical</h3><div class="value">$TFSEC_CRITICAL</div></div>
              <div class="card high"><h3>High</h3><div class="value">$TFSEC_HIGH</div></div>
              <div class="card medium"><h3>Medium</h3><div class="value">$TFSEC_MEDIUM</div></div>
              <div class="card low"><h3>Low</h3><div class="value">$TFSEC_LOW</div></div>
              <div class="card"><h3>Total</h3><div class="value">$TFSEC_TOTAL</div></div>
            </div>
            <table>
              <thead><tr><th>Severidad</th><th>Rule ID</th><th>Descripción</th></tr></thead>
              <tbody>
              $TOP_FINDINGS_TFSEC_HTML
              </tbody>
            </table>
          </div>

          <footer>Generado automáticamente por GitHub Actions · Run #${{ github.run_number }}</footer>
          </body>
          </html>
          HTMLEOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4